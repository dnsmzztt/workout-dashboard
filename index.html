<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Winter Arc 26/27</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f2f2f7; --card:#fff; --fill:rgba(118,118,128,.12); --thumb:#fff;
    --sep:rgba(60,60,67,.18);
    --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
    --accent:#0a7bc2; --on:#28a745; --off:#e8820c;
    --p:#3478f6; --c:#f5a524; --g:#2bbf8a;
    --bar:rgba(249,249,251,.72);
    --round:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000; --card:#1c1c1e; --fill:rgba(118,118,128,.24); --thumb:#636366;
      --sep:rgba(84,84,88,.5);
      --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.28);
      --accent:#64d2ff; --on:#30d158; --off:#ff9f0a;
      --p:#5e9eff; --c:#ffb340; --g:#4fd8a6;
      --bar:rgba(30,30,32,.7);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);color:var(--label);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
    letter-spacing:-.01em;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  b{font-weight:600;}
  .num{font-variant-numeric:tabular-nums;}
  .mut{color:var(--label2);}

  .wrap{max-width:640px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom));}
  .eyebrow{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;padding-top:18px;}
  h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:2px 0 16px;}
  h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:30px 4px 10px;}
  .foot{font-size:13px;color:var(--label2);margin:10px 4px 0;line-height:1.45;}
  .foot b{color:var(--label);}

  .view{display:none;}
  .view.active{display:block;}

  /* cards & lists */
  .card{background:var(--card);border-radius:22px;overflow:hidden;}
  .card+.card{margin-top:12px;}
  .pad{padding:16px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:48px;position:relative;}
  .row+.row::before,.row+details::before,details+.row::before,details+details::before{content:'';position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep);}
  .row .r,summary .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .row .sub,summary .sub{display:block;font-size:13px;color:var(--label2);margin-top:1px;}
  .row.stack{display:block;}
  .row.stack p{font-size:14px;color:var(--label2);margin-top:3px;line-height:1.45;}
  .row.stack p b{color:var(--label);}

  /* disclosures */
  details{position:relative;}
  summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:48px;}
  summary::-webkit-details-marker{display:none;}
  summary>span:first-child{flex:1;min-width:0;}
  summary::after{content:'';flex:none;width:8px;height:8px;border-right:2px solid var(--label3);border-bottom:2px solid var(--label3);transform:rotate(-45deg);transition:transform .2s;margin-right:4px;}
  details[open]>summary::after{transform:rotate(45deg);}
  .dbody{padding:0 16px 14px;font-size:14px;line-height:1.5;color:var(--label2);}
  .dbody b{color:var(--label);}
  .dbody i{font-style:normal;color:var(--label3);}
  .dbody p+p{margin-top:8px;}
  .dbody ul{list-style:none;}
  .dbody li{padding-left:14px;position:relative;margin-top:4px;}
  .dbody li::before{content:'';position:absolute;left:2px;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--label3);}

  /* segmented */
  .sticky{position:sticky;top:env(safe-area-inset-top);z-index:20;margin:0 -16px;padding:8px 16px 10px;background:var(--bg);}
  .seg{--n:2;--i:0;position:relative;display:flex;background:var(--fill);border-radius:100px;padding:3px;}
  .seg::before{content:'';position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:100px;background:var(--thumb);box-shadow:0 2px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transform:translateX(calc(var(--i)*100%));transition:transform .28s cubic-bezier(.3,.7,.2,1);}
  .seg button{flex:1;position:relative;z-index:1;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--label);padding:7px 2px;cursor:pointer;white-space:nowrap;letter-spacing:-.01em;}
  .seg button:not(.on){color:var(--label2);}
  .seg.sm button{font-size:13px;padding:5px 2px;}

  /* hero */
  .hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
  .big{font-family:var(--round);font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
  .big small{font-size:20px;font-weight:600;color:var(--label2);letter-spacing:-.01em;}
  .kicker{font-size:13px;color:var(--label2);font-weight:500;margin-bottom:6px;}
  .chart{display:block;width:100%;height:auto;margin-top:14px;overflow:visible;}
  .chart text{font:500 10px -apple-system,system-ui,sans-serif;fill:var(--label2);}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--sep);}
  .chips div{padding:12px 4px;text-align:center;}
  .chips div+div{border-left:.5px solid var(--sep);}
  .chips span{display:block;font-size:11px;color:var(--label2);text-transform:uppercase;letter-spacing:.03em;}
  .chips b{font-family:var(--round);font-size:17px;font-variant-numeric:tabular-nums;}

  /* day summary */
  .day-sum{display:flex;align-items:center;gap:18px;}
  .day-sum .big{color:var(--tone);}
  .macros{flex:1;display:grid;gap:7px;}
  .mrow{display:grid;grid-template-columns:16px 1fr 44px;align-items:center;gap:8px;font-size:13px;}
  .mrow i{font-style:normal;font-weight:700;color:var(--m);}
  .mrow .track{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;}
  .mrow .track div{height:100%;border-radius:3px;background:var(--m);}
  .mrow span{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .tone-on{--tone:var(--on);} .tone-off{--tone:var(--off);}

  /* meal */
  .meal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 4px;}
  .meal-h h3{font-size:19px;font-weight:700;letter-spacing:-.02em;}
  .meal-h .sub{font-size:13px;color:var(--label2);}
  .meal-h .kcal{font-family:var(--round);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .meal-h .kcal small{font-size:12px;color:var(--label2);font-weight:600;}
  .mline{display:flex;gap:12px;align-items:center;padding:4px 16px 10px;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums;}
  .mline b{color:var(--label);}
  .mline .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;}
  .split{display:flex;height:4px;border-radius:2px;overflow:hidden;flex:1;min-width:40px;gap:2px;}
  .split div{height:100%;border-radius:2px;}
  .food .q{font-variant-numeric:tabular-nums;color:var(--label2);white-space:nowrap;}
  .food .n small{color:var(--label2);font-size:13px;}
  .inner-seg{padding:4px 16px 8px;}
  .vmeta{font-size:12px;color:var(--label2);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums;}
  .sumtag{font-size:15px;}
  .sumtag em{font-style:normal;color:var(--label2);font-size:13px;margin-left:6px;}

  /* workout */
  .wo-h{padding:18px 16px 8px;}
  .wo-h .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:100px;padding:3px 10px;margin-bottom:8px;}
  .wo-h h3{font-size:24px;font-weight:700;letter-spacing:-.025em;}
  .wo-h p{font-size:14px;color:var(--label2);}
  .ex{align-items:flex-start;}
  .ex .i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--fill);font-size:12px;font-weight:600;display:grid;place-items:center;color:var(--label2);margin-top:1px;font-variant-numeric:tabular-nums;}
  .ex .n{flex:1;min-width:0;}
  .ex .r b{display:block;font-size:16px;}
  .ex .r span{font-size:13px;color:var(--label2);}
  .lift .goal{color:var(--on);font-weight:600;font-size:15px;}

  /* week */
  .wk .d{width:40px;flex:none;font-weight:600;color:var(--label2);font-size:14px;}
  .wk .w{flex:1;}
  .wk.rest .w{color:var(--label2);}
  .pill{font-size:12px;font-weight:700;border-radius:100px;padding:3px 9px;letter-spacing:.02em;}
  .pill.on{color:var(--on);background:color-mix(in srgb,var(--on) 15%,transparent);}
  .pill.off{color:var(--off);background:color-mix(in srgb,var(--off) 15%,transparent);}
  .pill.opt{color:var(--label2);background:var(--fill);}

  /* table */
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th{font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.03em;text-align:right;padding:12px 16px 6px;}
  th:first-child,td:first-child{text-align:left;}
  td{padding:10px 16px;text-align:right;border-top:.5px solid var(--sep);}
  tfoot td{font-weight:700;font-family:var(--round);font-size:17px;}
  .c-on{color:var(--on);} .c-off{color:var(--off);}

  .note{border-radius:22px;padding:16px;background:color-mix(in srgb,var(--accent) 10%,var(--card));font-size:14px;line-height:1.5;color:var(--label2);margin-top:12px;}
  .note h4{font-size:16px;color:var(--label);margin-bottom:4px;letter-spacing:-.01em;}
  .note b{color:var(--label);}

  /* tab bar */
  .tabbar{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 6px);width:calc(100% - 32px);max-width:420px;display:flex;padding:5px;border-radius:100px;background:var(--bar);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 0 0 .5px var(--sep),0 10px 30px rgba(0,0,0,.18);}
  .tabbar button{flex:1;border:0;background:none;font:inherit;color:var(--label2);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:100px;cursor:pointer;font-size:10px;font-weight:600;transition:background .2s,color .2s;}
  .tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tabbar button.on{color:var(--accent);background:var(--fill);}
</style>
</head>

<script>
/* ============================================================
   DATI — modifica qui. Il layout sotto si aggiorna da solo.

const BLOCK = {

  energy: [

    ['Surplus medio', '~310 kcal'],
    ['Media settimanale', '~3.210 kcal'],
    ['Crescita attesa', '+0,2–0,3 kg/sett'],
  ],
};

const DAYS = {
  on: {
    label: 'Giorno ON', meta: 'Giorni di allenamento · carbo alti attorno al workout',
    kcal: 3330, p: 198, c: 415, g: 93,
    meals: [
      { name: 'Colazione', when: 'porridge compatto', kcal: 725, p: 45, c: 86, g: 23,
        foods: [['Avena', '60 g'], ['Skyr / yogurt greco 0%', '200 g'], ['Banana', '120 g'], ["Burro d'arachidi", '30 g'], ['Latte parz. scremato', '200 ml', 'da bere']],
        prep: `<b>5 min</b> · Avena al microonde 90 sec, skyr fuori dal fuoco, banana e burro d'arachidi sopra; il latte lo bevi a parte. 60 g di avena invece di 100 perché il fiocco assorbe 3-4 volte il suo peso in acqua e ti gonfia. Niente miele: la banana basta a renderlo dolce.`,
        tips: [['Ancora troppo pesante?', `Bevi il latte a metà mattina invece che a colazione: le calorie restano nella giornata, il piatto si alleggerisce.`]] },
      { name: 'Spuntino', when: 'metà mattina', kcal: 565, p: 31, c: 51, g: 24,
        foods: [['Fiocchi di latte light', '200 g'], ['Crackers', '45 g'], ['Marmellata', '20 g'], ['Noci', '20 g'], ['Caffè', '×2']],
        prep: `<b>0 min</b> · Tutto portatile: crackers con la marmellata, le noci chiudono i grassi buoni. 45 g di crackers valgono i 70 g di pane, ma pesano meno sullo stomaco prima di pranzo.`,
        tips: [['Niente fiocchi di latte?', `<p>Sostituisci i 200 g (~25 g proteine) con:</p><ul><li><b>Skyr / yogurt greco 200 g</b> <i>(il più simile)</i></li><li><b>Tonno 120 g</b>, <b>bresaola 70 g</b> o <b>prosciutto cotto ~120 g</b> <i>(rotazione, non fisso: più salato)</i></li><li><b>Shaker whey 30 g</b></li><li><b>Uova 3</b> <i>ok ma più grasse — vale anche per lo spuntino OFF.</i></li></ul>`]] },
      { name: 'Pranzo', when: 'schiscetta', kcal: 730, p: 40, c: 98, g: 18,
        foods: [['Riso basmati', '120 g', 'crudo'], ['Petto di pollo', '130 g', 'crudo'], ['Olio EVO', '15 g'], ['Verdure', '~100 g']],
        prep: `<b>Prep la sera prima</b> · Un terzo di volume in meno rispetto a prima (da ~840 g a ~560 g nel piatto). Le calorie tolte qui sono passate al pre-WO e ai giorni OFF, dove entrano più facilmente. Verdure 100 g e basta: saziano senza dare calorie, nei giorni ON non ti servono a pranzo.`,
        tips: [
          ['Ancora non va giù?', `Dividilo: metà alle 12:30, metà verso le 15:30. Contano le calorie della giornata, non l'orario del pasto.`],
          ['Salmone affumicato e gnocchi', `<b>Gnocchi 280 g + salmone affumicato 120 g + olio 10 g + verdure</b> <i>(~650 kcal · P41 · C84 · G15)</i>. Occasionale, non fisso: il salmone affumicato è molto salato (ritenzione → falso peso il giorno dopo). Giorno OFF: gnocchi 250 g + salmone 130 g.`],
        ] },
      { name: 'Pre-WO', when: 'pomeriggio · tutto portatile', kcal: 570, p: 34, c: 97, g: 5,
        foods: [['Pan bauletto di grano duro', '100 g', '~4 fette'], ['Marmellata', '30 g'], ['Banana', '120 g'], ['Whey protein', '30 g', 'shaker con acqua'], ['Creatina', '6 g']],
        prep: `<b>1 min</b> · Due toast di bauletto con la marmellata, la banana, e la whey nello shaker con acqua. Carbo rapidi e pochi grassi: si digerisce in fretta e arrivi alla seduta carico, non pieno. Mangialo 60-90 min prima.`,
        tips: [['Senza banana?', `<p>Qui servono zuccheri rapidi (vale ~105 kcal):</p><ul><li><b>+40 g di marmellata</b> sul bauletto <i>(~100 kcal)</i></li><li>oppure <b>mela ~180 g</b> o <b>uva ~150 g</b> <i>(~95 kcal)</i></li></ul>`]] },
      { name: 'Cena', when: 'post-workout · ~21:00', kcal: 740, p: 48, c: 83, g: 23,
        foods: [['Pollo / merluzzo / gamberi', '160–200 g'], ['Patate oppure pane', '450 / 140 g'], ['Olio EVO', '20 g'], ['Verdure', '~150 g']],
        prep: `<p><b>10 min</b> · Merluzzo e gamberi cuociono in 5 min, patate al microonde. Il pasto che ricarica il glicogeno per la seduta di domani.</p><p>Patate o pane si equivalgono (~80 g di carbo). Se la sera sei già pieno scegli il pane: occupa un terzo del volume delle patate.</p>`,
        tips: [['Salmone fresco 2 sere a settimana', `Al posto del pollo: <b>salmone 180 g, niente olio aggiunto</b>, patate 450 g o pane 140 g <i>(~745 kcal · P47 · C83 · G24)</i>. Omega-3 e grassi buoni: in massa il salmone è un alleato, non un extra.`]] },
    ],
  },
  off: {
    label: 'Giorno OFF', meta: 'Giorni di riposo · si cresce anche da fermi',
    kcal: 3080, p: 214, c: 327, g: 102,
    meals: [

          { name: 'Salata', kcal: 680, p: 43, c: 76, g: 23,
            foods: [['Uova', '3 (150 g)'], ['Pane', '70 g', '2 fette'], ['Avocado', '50 g'], ['Yogurt greco 0%', '150 g', 'a fine pasto'], ['Banana', '120 g', 'nello yogurt']],
            prep: `<b>6 min</b> · Uova strapazzate e due fette di pane tostato con l'avocado schiacciato. Per chiudere, yogurt greco con la banana a rondelle. Il pane scende da 140 a 70 g: la banana recupera i carbo, lo yogurt aggiunge proteine senza appesantire il piatto.` },
        ],
        tips: [['Varianti', `<ul><li><b>Dolce:</b> avena → muesli senza zucchero 55 g o corn flakes 50 g · noci → mandorle 30 g · banana → mela 180 g o frutti di bosco 200 g</li><li><b>Salata:</b> yogurt greco → skyr 150 g · avocado → olio EVO 7 g sul pane · banana → frutti di bosco 200 g nello yogurt o spremuta d'arancia 250 ml</li><li><b>Veloce 0 min:</b> fiocchi di latte 250 g + crackers 50 g + noci 15 g + banana <i>(~655 kcal · P39)</i></li></ul>`]] },
      { name: 'Spuntino', when: 'metà mattina', kcal: 525, p: 32, c: 36, g: 27,
        foods: [['Fiocchi di latte light', '200 g'], ['Crackers', '40 g'], ['Noci', '25 g'], ['Caffè', '×2']],
        prep: `<b>0 min</b> · Nei giorni di riposo i carbo scendono un po' e salgono i grassi: le noci in più portano i giorni OFF sopra il mantenimento. Qui si recupera, non si taglia.` },
      { name: 'Pranzo', when: 'schiscetta', kcal: 745, p: 46, c: 83, g: 23,
        foods: [['Pasta', '110 g', 'cruda'], ['Tonno al naturale', '130 g'], ['Olio EVO', '20 g'], ['Verdure', '≥150 g']],
        prep: `<b>Prep la sera prima</b> · Insalata di pasta fredda: si prepara in anticipo, perfetta da ufficio. +30 g di pasta rispetto al cut.` },

const $ = s => document.querySelector(s);

};
const toDate = s => new Date(s + 'T00:00:00');
const daysBetween = (a, b) => Math.round((b - a) / 864e5); // arrotonda per l'ora legale
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

function seg(id, labels, active, cls = '') {
  return `<div class="seg ${cls}" id="${id}" style="--n:${labels.length};--i:${active}">${labels.map((l, i) => `<button data-i="${i}" class="${i == active ? 'on' : ''}">${l}</button>`).join('')}</div>`;
}
function bindSeg(id, onChange) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    el.style.setProperty('--i', b.dataset.i);
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    onChange(+b.dataset.i);
  });
}

/* ---------- Piano ---------- */
function renderPiano() {
  const start = toDate(BLOCK.start), now = new Date();
  const day = daysBetween(start, new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const week = Math.min(BLOCK.weeks, Math.max(1, Math.floor(day / 7) + 1));
  const done = day >= BLOCK.weeks * 7;

  const pts = BLOCK.route.map(([d, kg, l]) => ({ t: daysBetween(start, toDate(d)), kg, l }));
  const T = pts.at(-1).t, W = 320, H = 110, x = t => 6 + (t / T) * (W - 12), y = kg => 10 + (100 - kg) / (100 - 91) * (H - 34);
  const t = Math.max(0, Math.min(T, day));
  let i = pts.findIndex(p => p.t >= t); if (i <= 0) i = 1;
  const a = pts[i - 1], b = pts[i], kgNow = a.kg + (b.kg - a.kg) * ((t - a.t) / (b.t - a.t || 1));
  const line = pts.map(p => `${x(p.t).toFixed(1)},${y(p.kg).toFixed(1)}`).join(' ');
  const past = pts.filter(p => p.t <= t).map(p => `${x(p.t).toFixed(1)},${y(p.kg).toFixed(1)}`).concat(`${x(t).toFixed(1)},${y(kgNow).toFixed(1)}`).join(' ');
  const nextDeload = BLOCK.deloads.find(w => w >= week);
  const deloadStart = nextDeload && addDays(start, (nextDeload - 1) * 7);
  const isDeload = BLOCK.deloads.includes(week) && !done;

  $('#v-piano').innerHTML = `
    <div class="card">
      <div class="pad">
        <div class="kicker">${done ? 'Blocco concluso' : isDeload ? 'Settimana di deload' : 'Bulk pulito · 91,5 → 100 kg'}</div>
        <div class="hero-top">
          <div class="big">Sett. ${week}<small> / ${BLOCK.weeks}</small></div>
          <div style="text-align:right"><div class="kicker" style="margin:0">rotta di oggi</div><div class="big" style="font-size:28px">~${fmt(kgNow, 1)}<small style="font-size:15px"> kg</small></div></div>
        </div>
        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rotta del peso da 91,5 a 100 kg">
          <line x1="6" x2="${W - 6}" y1="${y(100)}" y2="${y(100)}" stroke="var(--sep)" stroke-dasharray="3 4"/>
          <polyline points="${line}" fill="none" stroke="var(--label3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="${past}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          ${pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.kg)}" r="2.5" fill="${p.t <= t ? 'var(--accent)' : 'var(--label3)'}"/>`).join('')}
          <circle cx="${x(t)}" cy="${y(kgNow)}" r="6" fill="var(--accent)" stroke="var(--card)" stroke-width="2.5"/>
          ${pts.map(p => `<text x="${x(p.t)}" y="${H - 4}" text-anchor="middle">${p.l}</text>`).join('')}
          ${pts.filter((p, k) => k === 0 || k === pts.length - 1).map(p => `<text x="${x(p.t)}" y="${y(p.kg) - 9}" text-anchor="${p.t ? 'end' : 'start'}" style="fill:var(--label)">${fmt(p.kg, p.kg % 1 ? 1 : 0)}</text>`).join('')}
        </svg>
      </div>
      <div class="chips">${BLOCK.stats.map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join('')}</div>
    </div>
    ${nextDeload && !done ? `<div class="card"><div class="row"><span>${isDeload ? 'Deload in corso' : 'Prossimo deload'}<span class="sub">volume −40%, carichi al ~70%</span></span><span class="r">${isDeload ? `sett. ${week}` : `sett. ${nextDeload} · ${deloadStart.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' })}`}</span></div></div>` : ''}

    <h2>Energia</h2>
    <div class="card">${BLOCK.energy.map(([l, v]) => `<div class="row"><span>${l}</span><span class="r mut">${v}</span></div>`).join('')}</div>
    <div class="note"><h4>La leva: come regolare</h4>${LEVER}</div>

    <h2>Settimana tipo</h2>
    <div style="margin-bottom:10px">${seg('seg-week', WEEK.options.map(o => o.name), store.get('cal', 0))}</div>
    <div class="card" id="week-list"></div>
    <p class="foot">${WEEK.intro} ${WEEK.note}</p>

    <h2>Regole fondamentali</h2>
    <div class="card">${RULES.map(([t, b]) => disclosure(t, b)).join('')}</div>

    <h2>Note strategiche</h2>
    <div class="card">${STRATEGY.map(([t, b]) => disclosure(t, b)).join('')}</div>`;

  const renderWeek = k => {
    $('#week-list').innerHTML = WEEK.options[k].days.map(([d, w, s]) =>
      `<div class="row wk ${s === 'off' ? 'rest' : ''}"><span class="d">${d}</span><span class="w">${w}</span><span class="pill ${s}">${s === 'opt' ? 'OFF/ON' : s.toUpperCase()}</span></div>`).join('');
  };
  renderWeek(+store.get('cal', 0));
  bindSeg('seg-week', k => { store.set('cal', k); renderWeek(k); });
}

/* ---------- Dieta ---------- */
function macroLine({ p, c, g }) {
  const tot = p * 4 + c * 4 + g * 9;
  return `<div class="mline"><span><span class="dot" style="background:var(--p)"></span><b>${p}</b> P</span><span><span class="dot" style="background:var(--c)"></span><b>${c}</b> C</span><span><span class="dot" style="background:var(--g)"></span><b>${g}</b> G</span>
    <span class="split"><div style="width:${p * 4 / tot * 100}%;background:var(--p)"></div><div style="width:${c * 4 / tot * 100}%;background:var(--c)"></div><div style="width:${g * 9 / tot * 100}%;background:var(--g)"></div></span></div>`;
}
function mealCard(m, key) {
  const approx = m.approx ? '~' : '';
  let body;
  if (m.variants) {
    const vi = +store.get('bf', 0);
    body = `<div class="inner-seg">${seg('seg-' + key, m.variants.map(v => v.name), vi, 'sm')}</div><div id="var-${key}"></div>`;
  } else {
    body = foodRows(m.foods) + disclosure('Preparazione', m.prep);
  }
  const tips = (m.tips || []).map(([t, b]) => disclosure(t, b)).join('');
  return `<div class="card">
    <div class="meal-h"><div><h3>${m.name}</h3><div class="sub">${m.when}</div></div><div class="kcal">${approx}${fmt(m.kcal)}<small> kcal</small></div></div>
    ${macroLine(m)}
    ${body}${tips}
  </div>`;
}
function renderVariant(m, key, vi) {
  const v = m.variants[vi];
  document.getElementById('var-' + key).innerHTML = `<div class="row" style="min-height:0;padding:2px 16px 6px"><span class="vmeta" style="margin:0;text-align:left">${v.name}: ${v.kcal} kcal · P${v.p} · C${v.c} · G${v.g}</span></div>` + foodRows(v.foods) + disclosure('Preparazione', v.prep);
}
function renderDieta() {
  const k = +store.get('day', 0);
  $('#v-dieta').innerHTML = `
    <div class="sticky">${seg('seg-day', [DAYS.on.label, DAYS.off.label], k)}</div>
    <div id="day-body"></div>

    <h2>Costruisci il piatto</h2>
    <p class="foot" style="margin:-4px 4px 10px">${BUILDER.intro}</p>
    ${BUILDER.groups.map(g => `<div class="card"><div class="row"><b>${g.title}</b><span class="r mut" style="font-size:13px">${g.head}</span></div>${g.items.map(([n, q]) => `<div class="row food"><span>${n}</span><span class="q">${q}</span></div>`).join('')}</div>`).join('')}
    <div class="card">${disclosure('Combo già pronte', `<ul>${BUILDER.combos.map(c => `<li>${c}</li>`).join('')}</ul>`)}</div>

    <h2>Consigli</h2>
    <div class="card">
      ${disclosure('Mangiare tanto senza stare male', EAT_TIPS)}
      ${disclosure('Giovedì: la pizza lavora per te', `<p>${PIZZA}</p>`)}
    </div>`;

  const renderDay = i => {
    const key = i ? 'off' : 'on', d = DAYS[key];
    const max = Math.max(d.p * 4, d.c * 4, d.g * 9);
    $('#day-body').innerHTML = `
      <div class="card pad tone-${key}">
        <div class="kicker">${d.meta}</div>
        <div class="day-sum">
          <div class="big">${fmt(d.kcal)}<small> kcal</small></div>
          <div class="macros">
            ${[['P', d.p, 4, 'p'], ['C', d.c, 4, 'c'], ['G', d.g, 9, 'g']].map(([l, v, f, c]) => `<div class="mrow" style="--m:var(--${c})"><i>${l}</i><div class="track"><div style="width:${v * f / max * 100}%"></div></div><span>${v} g</span></div>`).join('')}
          </div>
        </div>
      </div>
      <h2>Pasti</h2>
      ${d.meals.map((m, j) => mealCard(m, key + j)).join('')}`;
    d.meals.forEach((m, j) => {
      if (!m.variants) return;
      const id = key + j;
      renderVariant(m, id, +store.get('bf', 0));
      bindSeg('seg-' + id, vi => { store.set('bf', vi); renderVariant(m, id, vi); });
    });
  };
  renderDay(k);
  bindSeg('seg-day', i => { store.set('day', i); renderDay(i); });
}

/* ---------- Allenamento ---------- */
function renderAllenamento() {
  const k = Math.min(WORKOUTS.length - 1, +store.get('wo', 0));
  $('#v-allenamento').innerHTML = `
    <div class="sticky">${seg('seg-wo', WORKOUTS.map(w => w.short), k, 'sm')}</div>
    <div id="wo-body"></div>

    <h2>Carichi · obiettivo marzo</h2>
    <div class="card">${LIFTS.map(([n, s, a, b, note]) => `<details class="lift"><summary><span>${n}<span class="sub">${s}${a === '—' ? '' : ` · start ${a}`}</span></span><span class="r goal">${b}</span></summary><div class="dbody">${note}</div></details>`).join('')}</div>
    <p class="foot">Start tarato sui carichi tenuti nel cut: le prime 2 settimane servono a riprendere il ritmo, poi si sale. Se la bilancia sale e questi numeri salgono con lei, i kg in più saranno in gran parte muscolo.</p>

    <h2>Progressione</h2>
    <div class="card">
      ${PROGRESSION.map(([t, b]) => disclosure(t, b)).join('')}
      ${disclosure('Filosofia del blocco', PHILOSOPHY)}
    </div>

    <h2>Palestra piena? Piano B</h2>
    <p class="foot" style="margin:-4px 4px 10px">${PLAN_B.intro}</p>
    <div class="card">${PLAN_B.items.map(([t, alts]) => disclosure(t, `<ul>${alts.map(a => `<li>${a}</li>`).join('')}</ul>`)).join('')}</div>
    <p class="foot">${PLAN_B.rule}</p>`;

  const renderWo = i => {
    const w = WORKOUTS[i];
    $('#wo-body').innerHTML = `<div class="card">
      <div class="wo-h"><span class="tag">${w.tag}</span><h3>${w.title}</h3><p>${w.focus}</p></div>
      ${w.ex.map(([n, aim, sets, rest], j) => `<div class="row ex"><span class="i">${j + 1}</span><span class="n">${n}<span class="sub">${aim}</span></span><span class="r"><b>${sets}</b><span>rec ${rest}</span></span></div>`).join('')}
    </div>${w.note ? `<p class="foot">${w.note}</p>` : ''}`;
  };
  renderWo(k);
  bindSeg('seg-wo', i => { store.set('wo', i); renderWo(i); });
}

/* ---------- Spesa ---------- */
function renderSpesa() {
  const rows = DAYS.on.meals.map((m, i) => {
    const o = DAYS.off.meals[i];
    const name = m.name === o.name ? (m.name === 'Spuntino' ? 'Spuntino AM' : m.name) : `${m.name} / Spuntino PM`;
    return `<tr><td>${name}</td><td class="c-on">${fmt(m.kcal)}</td><td class="c-off">${fmt(o.kcal)}</td></tr>`;
  }).join('');
  const macro = d => `P ${d.p} · C ${d.c} · G ${d.g}`;
  $('#v-spesa').innerHTML = `
    <div class="card">
      <div class="row"><span>Spesa settimanale<span class="sub">${SHOP.where}</span></span><span class="r" style="font-weight:600">${SHOP.total}</span></div>
    </div>
    <div class="card">${SHOP.items.map(([c, e, items]) => `<div class="row stack"><div style="display:flex;justify-content:space-between"><b>${c}</b><span class="mut num">${e}</span></div><p>${items}</p></div>`).join('')}</div>
    <div class="note"><h4>Integratori, fuori budget</h4>${SHOP.supplements}</div>

    <h2>Riepilogo kcal</h2>
    <div class="card">
      <table>
        <thead><tr><th>Pasto</th><th class="c-on">ON</th><th class="c-off">OFF</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>Totale</td><td class="c-on">${fmt(DAYS.on.kcal)}</td><td class="c-off">${fmt(DAYS.off.kcal)}</td></tr></tfoot>
      </table>
    </div>
    <div class="card">
      <div class="row"><span>Macro ON</span><span class="r mut">${macro(DAYS.on)}</span></div>
      <div class="row"><span>Macro OFF</span><span class="r mut">${macro(DAYS.off)}</span></div>
    </div>
    <p class="foot">${MACRO_NOTE}</p>`;
}

/* ---------- Tab ---------- */
const TITLES = { piano: 'Piano', dieta: 'Dieta', allenamento: 'Allenamento', spesa: 'Spesa' };
function go(tab, scroll = true) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + tab));
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#title').textContent = TITLES[tab];
  store.set('tab', tab);
  if (scroll) window.scrollTo(0, 0);
}
$('#tabbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });

renderPiano(); renderDieta(); renderAllenamento(); renderSpesa();
const saved = store.get('tab', 'piano');
go(TITLES[saved] ? saved : 'piano', false);
</script>
</body>
</html>
